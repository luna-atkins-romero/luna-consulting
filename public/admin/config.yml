backend:
  name: github
  repo: luna-atkins-romero/luna-consulting
  branch: main

# Uncomment for local development/testing
# local_backend: true

media_folder: "src/assets/images/articles"
public_folder: "/src/assets/images/articles"

collections:
  - name: "articles"
    label: "Articles"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }
