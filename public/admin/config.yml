backend:
  name: github
  repo: luna-atkins-romero/luna-consulting
  branch: main

media_folder: "src/assets/images/articles"
public_folder: "/src/assets/images/articles"

collections:
  - name: "articles"
    label: "Articles"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false  # Disable preview to avoid formatting issues
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { 
          label: "Publish Date", 
          name: "date", 
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD"
        }
      - { 
          label: "Body", 
          name: "body", 
          widget: "markdown",
          modes: ["raw"],
          sanitize_preview: false
        }
